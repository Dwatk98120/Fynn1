
name: Build APK - Recording Indicator Fix

on:
  push:
    branches:
      - hearlium-parent-pc-integration
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify PC analysis button
        run: |
          grep -Fq 'SEND & ANALYZE ON PC' app/src/main/java/com/firstsoundhelper/MainActivity.kt
          grep -Fq 'uploadForAnalysis' app/src/main/java/com/firstsoundhelper/MainActivity.kt

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hearlium-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14


