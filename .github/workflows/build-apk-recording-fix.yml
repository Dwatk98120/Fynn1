name: Build APK - Recording Indicator Fix
on:
  push:
    branches:
      - hearlium-parent-pc-integration
  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply and verify recording indicator patch
        run: |
          python3 tools/apply_recording_indicator_fix.py
          grep -q 'activeRecordingIndicator' app/src/main/res/layout/activity_main.xml
          grep -q 'setRecordingIndicator(true)' app/src/main/java/com/firstsoundhelper/MainActivity.kt
          grep -q 'setRecordingIndicator(false)' app/src/main/java/com/firstsoundhelper/MainActivity.kt
      - name: Bootstrap Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Regenerate Gradle wrapper
        run: |
          rm -f ./gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x ./gradlew
      - name: Build debug APK with indicator
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Upload fixed APK
