plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def buildCommit = System.getenv('GITHUB_SHA')?.take(12)
if (!buildCommit) {
    try {
        def gitProcess = new ProcessBuilder('git', 'rev-parse', '--short=12', 'HEAD')
            .directory(rootDir).redirectErrorStream(true).start()
        def output = gitProcess.inputStream.getText('UTF-8').trim()
        buildCommit = gitProcess.waitFor() == 0 ? output : 'Unavailable'
    } catch (Exception ignored) { buildCommit = 'Unavailable' }
}

android {
    namespace 'com.firstsoundhelper'
    compileSdk 35
    defaultConfig {
        applicationId 'com.firstsoundhelper'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '3.3.5'
        buildConfigField 'String', 'BUILD_GRADLE_VERSION', groovy.json.JsonOutput.toJson(gradle.gradleVersion)
        buildConfigField 'String', 'BUILD_AGP_VERSION', groovy.json.JsonOutput.toJson(com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION)
        buildConfigField 'String', 'BUILD_TIMESTAMP_UTC', groovy.json.JsonOutput.toJson(java.time.Instant.now().toString())
        buildConfigField 'String', 'BUILD_COMMIT', groovy.json.JsonOutput.toJson(buildCommit)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
